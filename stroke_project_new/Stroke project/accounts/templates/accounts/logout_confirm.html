{% extends 'base.html' %}

{% block title %}Logout - Stroke Detection System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card card-custom">
            <div class="card-body text-center p-5">
                <i class="fas fa-sign-out-alt fa-3x text-danger mb-4"></i>
                <h3 class="card-title mb-3">Confirm Logout</h3>
                <p class="card-text text-muted mb-4">
                    Are you sure you want to logout? You will need to login again to access your account.
                </p>
                
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <a href="{% url 'detection:dashboard' %}" class="btn btn-secondary btn-custom">
                        <i class="fas fa-arrow-left me-2"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-danger btn-custom">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
