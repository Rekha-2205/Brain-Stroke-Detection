{% extends 'base.html' %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card card-custom">
        <div class="card-body p-4 text-center">
          <h4 class="mb-2">Check your email</h4>
          <p class="text-muted">We've sent you an email with a link to reset your password.</p>
          <a href="{% url 'accounts:login' %}" class="btn btn-secondary mt-3">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
